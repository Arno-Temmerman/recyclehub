<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RecycleHub - Klant</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="shortcut icon" href="#">
</head>

<body class="bg-light">
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">🗑️ RecycleHub</a>
            <ul class="navbar-nav ms-auto d-flex flex-row gap-3">
                <li class="nav-item">
                    <a class="nav-link" href="customer_list.html">Klanten</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="pickup_list.html">Ophalingen</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- PAGE CONTENT -->
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header">
                        <h4 class="mb-0">Details van de klant</h4>
                    </div>
                    <div class="card-body">
                        <!-- FORMULIER -->
                        <form id="customer-form">
                            <input type="hidden" id="id" name="id" />
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Voornaam</label>
                                    <input type="text" class="form-control" id="firstName" name="firstName">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Achternaam</label>
                                    <input type="text" class="form-control" id="lastName" name="lastName">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">E-mail</label>
                                <input type="email" class="form-control" id="email" name="email">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Telefoon</label>
                                <input type="text" class="form-control" id="phone" name="phone">
                            </div>
                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Straat</label>
                                    <input type="text" class="form-control" id="street" name="street">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Postcode</label>
                                    <input type="text" class="form-control" id="postalCode" name="postalCode">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Gemeente</label>
                                    <input type="text" class="form-control" id="city" name="city">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Saldo</label>
                                <input type="number" class="form-control" id="balance" name="balance" step="0.01">
                            </div>
                            <!-- KNOP "WIJZIGEN" -->
                            <button type="submit" class="btn btn-outline-success w-100 mb-2">Wijzigingen opslaan</button>
                            <!-- KNOP "VERWIJDEREN" -->
                            <button type="button" id="deleteBtn" class="btn btn-outline-danger w-100">Verwijder klant</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script type="module" src="./js/customer_details/customer_details.js"></script>
</body>

</html>
